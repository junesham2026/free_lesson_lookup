<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滬江小學空節老師搜尋器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans HK"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#D32F2F', // 深紅色
                            lightred: '#FFEBEE', // 淺紅背景
                            darkred: '#B71C1C',
                            white: '#FFFFFF',
                            gray: '#F5F5F5',
                            text: '#333333'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAFA;
            color: #333333;
        }
        .period-btn {
            transition: all 0.2s ease-in-out;
        }
        .period-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(211, 47, 47, 0.2), 0 2px 4px -1px rgba(211, 47, 47, 0.1);
        }
        .period-btn.active {
            background-color: #D32F2F;
            color: white;
            border-color: #B71C1C;
            font-weight: bold;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.1);
        }
        .teacher-card {
            transition: all 0.3s ease;
        }
        .teacher-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(211, 47, 47, 0.1), 0 4px 6px -2px rgba(211, 47, 47, 0.05);
        }
        /* Custom Scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D32F2F; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B71C1C; 
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-brand-red text-white py-4 px-6 shadow-md z-10 shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- SVG Icon for School/Search -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <h1 class="text-2xl font-bold tracking-wider">滬江小學空節老師搜尋器</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- 老師搜尋欄 -->
                <div class="relative z-50">
                    <div class="flex items-center bg-white rounded-lg overflow-hidden px-2 py-1.5 focus-within:ring-2 focus-within:ring-brand-lightred shadow-sm border border-transparent focus-within:border-brand-red/30 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" id="teacher-search-input" placeholder="搜尋老師名稱..." class="w-32 md:w-40 lg:w-48 px-2 py-1 text-sm outline-none text-gray-700 bg-transparent placeholder-gray-400">
                    </div>
                    <!-- 搜尋建議下拉選單 -->
                    <div id="search-suggestions" class="absolute top-full mt-1 w-full bg-white rounded-lg shadow-lg border border-gray-100 hidden z-[60] max-h-60 overflow-y-auto"></div>
                </div>

                <div class="text-sm opacity-80 hidden md:block">
                    目前選擇: <span id="current-selection-display" class="font-bold">未選擇</span>
                </div>
                <div class="relative">
                    <input type="file" id="excel-upload" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                    <button onclick="document.getElementById('excel-upload').click()" class="bg-white text-brand-red hover:bg-gray-100 font-bold py-2 px-4 rounded-lg shadow-sm text-sm flex items-center gap-2 transition-colors border border-transparent hover:border-brand-red/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        匯入全校老師課表
                    </button>
                    <div class="absolute -bottom-6 right-0 text-[10px] opacity-70 whitespace-nowrap">
                        請匯入: 全校老師總表_滬江.xlsx
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden bg-brand-lightred max-w-screen-2xl mx-auto w-full">
        
        <!-- Left Panel: Timetable Selection -->
        <aside class="w-1/3 min-w-[300px] max-w-[400px] bg-white border-r-2 border-brand-red/20 shadow-lg flex flex-col z-0">
            <div class="p-4 bg-brand-red/5 border-b border-brand-red/10">
                <h2 class="text-lg font-bold text-brand-darkred flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                    </svg>
                    時間表選擇
                </h2>
                
                <!-- Day Tabs -->
                <div class="flex mt-3 rounded-lg overflow-hidden border border-brand-red/30">
                    <button class="day-tab flex-1 py-2 text-sm font-medium text-center bg-brand-red text-white" data-day="1">一</button>
                    <button class="day-tab flex-1 py-2 text-sm font-medium text-center bg-white text-brand-red hover:bg-brand-red/10" data-day="2">二</button>
                    <button class="day-tab flex-1 py-2 text-sm font-medium text-center bg-white text-brand-red hover:bg-brand-red/10" data-day="3">三</button>
                    <button class="day-tab flex-1 py-2 text-sm font-medium text-center bg-white text-brand-red hover:bg-brand-red/10" data-day="4">四</button>
                    <button class="day-tab flex-1 py-2 text-sm font-medium text-center bg-white text-brand-red hover:bg-brand-red/10" data-day="5">五</button>
                </div>
            </div>

            <!-- Periods Grid -->
            <div class="flex-1 overflow-y-auto p-4" id="periods-container">
                <!-- Periods will be generated by JS -->
            </div>
        </aside>

        <!-- Right Panel: Results -->
        <section class="flex-1 flex flex-col relative overflow-hidden bg-brand-gray">
            
            <!-- VIEW 1: Period View (Original) -->
            <div id="period-view" class="flex-1 flex flex-col h-full overflow-hidden">
                <!-- Result Header -->
                <div class="p-4 bg-white border-b shadow-sm shrink-0 flex justify-between items-end">
                    <div>
                        <h2 class="text-xl font-bold text-brand-darkred flex items-center gap-2">
                        </svg>
                        當節空堂老師名單
                    </h2>
                    <p class="text-sm text-gray-500 mt-1" id="result-meta">請在左方選擇星期及節次</p>
                </div>
                <div class="text-sm text-gray-600 bg-gray-100 px-3 py-1 rounded-full font-medium shadow-inner" id="total-free-count">
                    共 0 人
                </div>
            </div>

            <!-- Teacher Cards Container -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="initial-state" class="h-full flex flex-col items-center justify-center text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mb-4 text-brand-red/20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-lg">點擊左側時間表節次以顯示空堂老師</p>
                </div>

                <div id="teachers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 hidden">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- Bottom Statistics Panel -->
            <div id="stats-panel" class="bg-white border-t border-brand-red/20 p-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] hidden">
                <h3 class="text-md font-bold text-brand-darkred mb-3 border-b pb-1">當日統計及建議</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    
                    <!-- Most Classes -->
                    <div class="bg-red-50 rounded-lg p-3 border border-red-100">
                        <div class="text-xs text-red-800 font-bold mb-1">今日最多課老師</div>
                        <div id="stat-most-classes" class="font-medium text-gray-800">-</div>
                    </div>
                    
                    <!-- Least Classes -->
                    <div class="bg-green-50 rounded-lg p-3 border border-green-100">
                        <div class="text-xs text-green-800 font-bold mb-1">今日最少課老師</div>
                        <div id="stat-least-classes" class="font-medium text-gray-800">-</div>
                    </div>
                    
                    <!-- Best Substitute -->
                    <div class="bg-brand-red text-white rounded-lg p-3 shadow-md relative overflow-hidden">
                        <!-- Decorative element -->
                        <div class="absolute -right-4 -top-4 w-16 h-16 bg-white/20 rounded-full"></div>
                        
                        <div class="text-xs font-bold mb-1 opacity-90 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                            </svg>
                            最適合代課老師
                        </div>
                        <div id="stat-best-sub" class="font-bold text-lg">-</div>
                        <div class="text-[10px] opacity-75 mt-1 leading-tight">條件: 請最多假、空節多、教該班、前後無課</div>
                    </div>
                </div>
            </div>

            <!-- VIEW 2: Teacher Weekly Timetable View (New) -->
            <div id="teacher-view" class="flex-1 flex flex-col h-full overflow-hidden hidden bg-white">
                <!-- Header for Teacher View -->
                <div class="p-4 bg-white border-b shadow-sm shrink-0 flex justify-between items-end">
                    <div>
                        <h2 class="text-xl font-bold text-brand-darkred flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <span id="teacher-view-name">老師名稱</span> 的全週課表
                        </h2>
                        <p class="text-sm text-gray-500 mt-1" id="teacher-view-meta">任教科目/班別</p>
                    </div>
                    <button onclick="closeTeacherView()" class="bg-gray-100 hover:bg-brand-lightred hover:text-brand-red text-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        返回空堂搜尋
                    </button>
                </div>
                
                <!-- Timetable Grid -->
                <div class="flex-1 overflow-auto p-6 bg-gray-50">
                    <div id="teacher-timetable-container" class="min-w-[700px] max-w-5xl mx-auto shadow-sm rounded-xl overflow-hidden bg-white border border-gray-200">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        // Constants
        const DAYS = ['星期一', '星期二', '星期三', '星期四', '星期五'];
        const PERIODS = [
            { id: 'pre_assembly_1', name: '早會前 7:30', time: '7:30 - 7:45' },
            { id: 'pre_assembly_2', name: '早會前 7:45', time: '7:45 - 8:10' },
            { id: 'assembly', name: '早會/班主任節', time: '8:10 - 8:35' },
            { id: 'p1', name: '第1節', time: '8:35 - 9:05' },
            { id: 'p2', name: '第2節', time: '9:05 - 9:35' },
            { id: 'recess_1', name: '小息1', time: '9:35 - 9:50', isBreak: true },
            { id: 'p3', name: '第3節', time: '9:50 - 10:20' },
            { id: 'p4', name: '第4節', time: '10:20 - 10:50' },
            { id: 'recess_2', name: '小息2', time: '10:50 - 11:05', isBreak: true },
            { id: 'p5', name: '第5節', time: '11:05 - 11:35' },
            { id: 'p6', name: '第6節', time: '11:35 - 12:05' },
            { id: 'lunch', name: '午膳', time: '12:05 - 12:45', isBreak: true },
            { id: 'lunch_break', name: '午息', time: '12:45 - 1:00', isBreak: true },
            { id: 'p7', name: '第7節', time: '1:00 - 1:30' },
            { id: 'p8', name: '第8節', time: '1:30 - 2:00' },
            { id: 'p9', name: '第9節', time: '2:00 - 2:30' },
            { id: 'p10', name: '第10節', time: '2:30 - 3:00' },
            { id: 'after_school', name: '放學當值', time: '3:00 - ' }
        ];

        // Mock Data based on real names found
        let TEACHERS = [
            { id: 't1', name: '羅筱彤', role: '副校長', subjects: ['英文', '人文'], classes: ['4A', '5B', '6C'] },
            { id: 't2', name: '袁潔儀', role: '副校長', subjects: ['中文', '視藝'], classes: ['1A', '2B', '3C'] },
            { id: 't3', name: '黃惠蘭', role: '主任', subjects: ['中文', '體育'], classes: ['4B', '5C', '6D'] },
            { id: 't4', name: '魏美琪', role: '主任', subjects: ['數學'], classes: ['1B', '2C', '3D'] },
            { id: 't5', name: '陳靄忻', role: '主任', subjects: ['中文', '音樂'], classes: ['2A', '4C', '5D'] },
            { id: 't6', name: '蕭燕唐', role: '主任', subjects: ['中文', '常識', '電腦'], classes: ['3A', '5A', '6A'] },
            { id: 't7', name: '黃錦蘭', role: '主任', subjects: ['英文', '視藝'], classes: ['1C', '3B', '4D'] },
            { id: 't8', name: '郭俊傑', role: '主任', subjects: ['數學', '常識'], classes: ['2D', '4A', '6B'] },
            { id: 't9', name: '邢芙蓉', role: '主任', subjects: ['中文', '音樂', '普通話'], classes: ['1D', '3C', '5B'] },
            { id: 't10', name: '黃梓晉', role: '主任', subjects: ['中文', '體育'], classes: ['2A', '4B', '6C'] },
            { id: 't11', name: '李紅', role: '班主任', subjects: ['科學', '電腦'], classes: ['1A', '3A', '5A'] },
            { id: 't12', name: '何嘉慧', role: '班主任', subjects: ['英文', '普通話'], classes: ['1B', '3B', '5B'] },
            { id: 't13', name: '胡詠敏', role: '班主任', subjects: ['數學', '視藝'], classes: ['1C', '3C', '5C'] },
            { id: 't14', name: '周淑敏', role: '班主任', subjects: ['英文'], classes: ['1D', '3D', '5D'] },
            { id: 't15', name: '賴樂昀', role: '班主任', subjects: ['英文', '常識'], classes: ['2A', '4A', '6A'] },
            { id: 't16', name: '黃佩柔', role: '班主任', subjects: ['英文', '電腦'], classes: ['2B', '4B', '6B'] },
            { id: 't17', name: '何曉欣', role: '班主任', subjects: ['中文', '常識'], classes: ['2C', '4C', '6C'] },
            { id: 't18', name: '莊美薇', role: '班主任', subjects: ['英文', '音樂'], classes: ['2D', '4D', '6D'] },
            { id: 't19', name: 'Brenden W.', role: 'NET', subjects: ['英文'], classes: ['P1-P6'] },
            { id: 't20', name: '陳耀珽', role: '班主任', subjects: ['數學', '體育'], classes: ['4A', '5A', '6A'] }
        ];

        // State
        let currentDay = 1; // 1-5 (Mon-Fri)
        let currentPeriodId = null;
        let scheduleData = {}; // Store generated schedule

        function showNotification(message, type = 'blue') {
            const notification = document.createElement('div');
            let bgColor = 'bg-gray-800';
            if (type === 'green') bgColor = 'bg-green-600';
            if (type === 'red') bgColor = 'bg-red-600';
            
            notification.className = `fixed bottom-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-xl z-50 transform transition-all duration-300 translate-y-full opacity-0 flex items-center gap-2`;
            notification.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                ${message}
            `;
            
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.classList.remove('translate-y-full', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                notification.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => notification.remove(), 300);
            }, 3500);
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showNotification('正在解析全校直向課表...', 'blue');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Read as an array of arrays (header: 1) to inspect rows and columns directly
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    
                    if (rows && rows.length > 1) {
                        processVerticalImportedData(rows);
                        showNotification('課表匯入成功！已更新直向老師空堂資料。', 'green');
                        
                        currentPeriodId = null;
                        renderPeriods();
                        updateHeaderDisplay();
                        document.getElementById('initial-state').classList.remove('hidden');
                        document.getElementById('teachers-grid').classList.add('hidden');
                        document.getElementById('stats-panel').classList.add('hidden');
                    } else {
                        showNotification('檔案格式錯誤或為空。', 'red');
                    }
                } catch (error) {
                    console.error(error);
                    showNotification('讀取失敗，請確保上傳的是正確的 Excel 檔案。', 'red');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processVerticalImportedData(rows) {
            // Rows format:
            // Row 0 (or Header): First column might be empty/time label, columns 1+ are Teacher Names
            // Subsequent rows: First column is Time/Period label (e.g., 星期一 早會前 7:30, 星期一 第1節 ... up to 星期五 放學當值)
            
            let teacherNames = [];
            let teacherColMap = {}; // colIndex -> teacherId
            let newTeachers = [];
            let newScheduleData = { 1:{}, 2:{}, 3:{}, 4:{}, 5:{} };

            // Find header row containing teacher names (usually row 0 or 1)
            let headerRowIndex = 0;
            for (let r = 0; r < Math.min(rows.length, 3); r++) {
                let nonEmpCount = rows[r].filter(cell => String(cell).trim() !== '').length;
                if (nonEmpCount > 2) {
                    headerRowIndex = r;
                    break;
                }
            }

            const headerRow = rows[headerRowIndex];
            
            // Map columns to teachers (starting from column index 1 or wherever names begin)
            for (let c = 1; c < headerRow.length; c++) {
                let name = String(headerRow[c]).trim();
                if (name) {
                    let tId = 't_imp_' + c;
                    teacherColMap[c] = tId;
                    
                    let teacherObj = {
                        id: tId,
                        name: name,
                        role: '老師',
                        subjects: ['全科'],
                        classes: []
                    };
                    newTeachers.push(teacherObj);

                    // Initialize schedule for this teacher
                    for (let d = 1; d <= 5; d++) {
                        newScheduleData[d][tId] = { stats: { classes: 0, leaves: 0, subs: 0 } };
                        PERIODS.forEach(p => {
                            newScheduleData[d][tId][p.id] = p.isBreak ? 'break' : 'free';
                        });
                    }
                }
            }

            if (newTeachers.length === 0) {
                throw new Error("找不到老師姓名列");
            }

            // Track daily stats
            let dailyClassCounts = {};
            let dailyLeaveCounts = {};
            let dailySubCounts = {};
            newTeachers.forEach(t => {
                for (let d = 1; d <= 5; d++) {
                    newScheduleData[d][t.id].stats = { classes: 0, leaves: 0, subs: 0 };
                }
            });

            // Loop through remaining rows for time periods and schedules
            let currentDayDetected = 1;

            for (let r = headerRowIndex + 1; r < rows.length; r++) {
                let row = rows[r];
                let timeLabel = String(row[0] || '').trim();
                
                if (!timeLabel) continue;

                // Detect current day from label (e.g. "星期一", "Mon", "一")
                if (timeLabel.includes('星期二') || timeLabel.includes('週二') || timeLabel.includes('二')) currentDayDetected = 2;
                else if (timeLabel.includes('星期三') || timeLabel.includes('週三') || timeLabel.includes('三')) currentDayDetected = 3;
                else if (timeLabel.includes('星期四') || timeLabel.includes('週四') || timeLabel.includes('四')) currentDayDetected = 4;
                else if (timeLabel.includes('星期五') || timeLabel.includes('週五') || timeLabel.includes('五')) currentDayDetected = 5;
                else if (timeLabel.includes('星期一') || timeLabel.includes('週一') || timeLabel.includes('一')) currentDayDetected = 1;

                // Match timeLabel to Period ID
                let pIdMatch = null;
                const tl = timeLabel.toLowerCase();
                
                if (tl.includes('7:30')) pIdMatch = 'pre_assembly_1';
                else if (tl.includes('7:45')) pIdMatch = 'pre_assembly_2';
                else if (tl.includes('早會') || tl.includes('班主任')) pIdMatch = 'assembly';
                else if (tl.includes('1') || tl.includes('p1')) pIdMatch = 'p1';
                else if (tl.includes('2') || tl.includes('p2')) pIdMatch = 'p2';
                else if (tl.includes('3') || tl.includes('p3')) pIdMatch = 'p3';
                else if (tl.includes('4') || tl.includes('p4')) pIdMatch = 'p4';
                else if (tl.includes('5') || tl.includes('p5')) pIdMatch = 'p5';
                else if (tl.includes('6') || tl.includes('p6')) pIdMatch = 'p6';
                else if (tl.includes('7') || tl.includes('p7')) pIdMatch = 'p7';
                else if (tl.includes('8') || tl.includes('p8')) pIdMatch = 'p8';
                else if (tl.includes('9') || tl.includes('p9')) pIdMatch = 'p9';
                else if (tl.includes('10') || tl.includes('p10')) pIdMatch = 'p10';
                else if (tl.includes('放學') || tl.includes('當值')) pIdMatch = 'after_school';

                if (pIdMatch && !PERIODS.find(p => p.id === pIdMatch).isBreak) {
                    // Check each teacher's column value
                    for (let c = 1; c < row.length; c++) {
                        let tId = teacherColMap[c];
                        if (!tId) continue;

                        let cellVal = String(row[c]).trim();
                        
                        // If cell is empty, it's a 吉節 (free)
                        if (cellVal === '' || cellVal === '吉' || cellVal.toLowerCase() === 'free' || cellVal === '吉節') {
                            newScheduleData[currentDayDetected][tId][pIdMatch] = 'free';
                        } else if (cellVal.includes('假') || cellVal.includes('Sick')) {
                            newScheduleData[currentDayDetected][tId][pIdMatch] = 'leave';
                            newScheduleData[currentDayDetected][tId].stats.leaves++;
                        } else if (cellVal.includes('代')) {
                            newScheduleData[currentDayDetected][tId][pIdMatch] = 'subbing';
                            newScheduleData[currentDayDetected][tId].stats.subs++;
                            
                            let teacherObj = newTeachers.find(t => t.id === tId);
                            let classPart = cellVal.split(' ')[0];
                            if (classPart && classPart.length <= 5 && !teacherObj.classes.includes(classPart)) {
                                teacherObj.classes.push(classPart);
                            }
                        } else {
                            // Busy with class or duty
                            newScheduleData[currentDayDetected][tId][pIdMatch] = 'busy';
                            newScheduleData[currentDayDetected][tId].stats.classes++;

                            let teacherObj = newTeachers.find(t => t.id === tId);
                            let classPart = cellVal.split(' ')[0];
                            if (classPart && classPart.length <= 5 && !teacherObj.classes.includes(classPart)) {
                                teacherObj.classes.push(classPart);
                            }
                        }
                    }
                }
            }

            TEACHERS = newTeachers;
            scheduleData = newScheduleData;
        }

        // Generate random schedule for all teachers for the whole week
        function generateSchedule() {
            for (let d = 1; d <= 5; d++) {
                scheduleData[d] = {};
                
                // Track daily stats
                let dailyClassCounts = {};
                let dailyLeaveCounts = {};
                let dailySubCounts = {};

                TEACHERS.forEach(t => {
                    dailyClassCounts[t.id] = 0;
                    dailyLeaveCounts[t.id] = 0;
                    dailySubCounts[t.id] = 0;
                    
                    // Determine if teacher is on leave today (small chance)
                    const isOnLeaveToday = Math.random() < 0.1; 

                    scheduleData[d][t.id] = {};
                    
                    PERIODS.forEach((p, index) => {
                        if (p.isBreak) {
                            scheduleData[d][t.id][p.id] = 'break';
                            return;
                        }

                        if (isOnLeaveToday) {
                            // If on leave, they are unavailable and count towards leave
                            scheduleData[d][t.id][p.id] = 'leave';
                            dailyLeaveCounts[t.id]++;
                            return;
                        }

                        // Randomly assign classes, duties, or free periods
                        // Higher probability of having a class during normal periods
                        let status;
                        const rand = Math.random();
                        
                        if (p.id.includes('pre_') || p.id === 'after_school') {
                            // Less likely to be busy before/after school
                            status = rand > 0.8 ? 'busy' : 'free';
                        } else {
                            // Normal classes
                            status = rand > 0.4 ? 'busy' : 'free';
                            
                            // Simulate substitutions (small chance if busy)
                            if (status === 'busy' && Math.random() < 0.15) {
                                status = 'subbing';
                                dailySubCounts[t.id]++;
                            } else if (status === 'busy') {
                                dailyClassCounts[t.id]++;
                            }
                        }

                        scheduleData[d][t.id][p.id] = status;
                    });

                    // Store daily stats within the schedule data
                    scheduleData[d][t.id].stats = {
                        classes: dailyClassCounts[t.id],
                        leaves: dailyLeaveCounts[t.id],
                        subs: dailySubCounts[t.id]
                    };
                });
            }
        }

        function updateStats() {
            const dayData = scheduleData[currentDay];
            
            // Calculate Most and Least Classes (excluding leaves)
            let maxClasses = -1;
            let minClasses = 999;
            let mostBusyTeachers = [];
            let leastBusyTeachers = [];

            // Find free teachers for current period to evaluate best sub
            let availableForSub = [];

            TEACHERS.forEach(t => {
                const stats = dayData[t.id].stats;
                const isLeaveToday = stats.leaves > 5; // Simple check if fully on leave

                if (!isLeaveToday) {
                    const totalWork = stats.classes + stats.subs;
                    
                    if (totalWork > maxClasses) {
                        maxClasses = totalWork;
                        mostBusyTeachers = [t.name];
                    } else if (totalWork === maxClasses) {
                        mostBusyTeachers.push(t.name);
                    }

                    if (totalWork < minClasses) {
                        minClasses = totalWork;
                        leastBusyTeachers = [t.name];
                    } else if (totalWork === minClasses) {
                        leastBusyTeachers.push(t.name);
                    }
                }

                // Check if free this period for best sub logic
                if (dayData[t.id][currentPeriodId] === 'free') {
                    
                    // Evaluate conditions for Best Sub:
                    // 1. Has taken most leaves (historically, but here we mock it by looking at past fake data, or just use least classes today as a proxy for "most free periods")
                    // 2. Most free periods today (lowest totalWork)
                    // 3. (Mocked) Teaches the class - hard to determine without knowing WHICH class needs a sub. We assume an ideal score based on general availability.
                    // 4. No class before and after (adjacent free periods)
                    
                    const currentIndex = PERIODS.findIndex(p => p.id === currentPeriodId);
                    
                    let prevFree = false;
                    let nextFree = false;
                    
                    // Check previous period (skip breaks)
                    for (let i = currentIndex - 1; i >= 0; i--) {
                        if (!PERIODS[i].isBreak) {
                            prevFree = dayData[t.id][PERIODS[i].id] === 'free';
                            break;
                        }
                    }
                    // Check next period (skip breaks)
                    for (let i = currentIndex + 1; i < PERIODS.length; i++) {
                         if (!PERIODS[i].isBreak) {
                            nextFree = dayData[t.id][PERIODS[i].id] === 'free';
                            break;
                        }
                    }

                    // Calculate a "suitability score"
                    let score = 0;
                    score -= stats.classes * 2; // Penalize for having many classes
                    score -= stats.subs * 3;    // Penalize heavily if already subbing
                    if (prevFree) score += 5;   // Bonus if previous period is free
                    if (nextFree) score += 5;   // Bonus if next period is free
                    
                    // Since we don't have historical leave data, we simulate "most leave" by adding a random factor to specific teachers to mock this condition.
                    if (['t7', 't12', 't15'].includes(t.id)) score += 10; 

                    availableForSub.push({ name: t.name, score: score, reason: `今日${stats.classes}節課, 前後空堂:${prevFree&&nextFree?'是':'否'}` });
                }
            });

            // Update DOM
            document.getElementById('stat-most-classes').innerText = mostBusyTeachers.length > 0 
                ? `${mostBusyTeachers.join(', ')} (${maxClasses}節)` 
                : '-';
            
            document.getElementById('stat-least-classes').innerText = leastBusyTeachers.length > 0 
                ? `${leastBusyTeachers.join(', ')} (${minClasses}節)` 
                : '-';

            // Find Best Sub
            const bestSubEl = document.getElementById('stat-best-sub');
            if (availableForSub.length > 0) {
                // Sort by highest score
                availableForSub.sort((a, b) => b.score - a.score);
                const best = availableForSub[0];
                
                bestSubEl.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span>${best.name}</span>
                        <span class="text-xs bg-white/20 px-2 py-1 rounded-full backdrop-blur-sm">推介</span>
                    </div>
                `;
                // bestSubEl.title = best.reason; // Optional: tooltip
            } else {
                bestSubEl.innerText = '無適合人選';
            }
        }
