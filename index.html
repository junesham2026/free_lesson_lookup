<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滬江小學 - 2026-2027年度 教師空節分析及時間表系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-red: #A6192E;
      --accent-red: #C8102E;
      --light-red: #FFF0F2;
    }
    .bg-red-theme { background-color: var(--primary-red); }
    .bg-red-accent { background-color: var(--accent-red); }
    .text-red-theme { color: var(--primary-red); }
    .border-red-theme { border-color: var(--primary-red); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 頂部導航 / 標題列 -->
  <header class="bg-red-theme text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide">滬江小學</h1>
        <p class="text-sm md:text-base text-red-100 mt-1">2026 – 2027 年度 教師空節分析及時間表系統</p>
      </div>
      <div class="flex items-center gap-3">
        <label class="cursor-pointer bg-white text-red-theme hover:bg-red-50 font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
          <span>📁 上傳全校總表 Excel</span>
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden">
        </label>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- 左側：時間表與時段選擇器 (佔 7 欄) -->
    <section class="lg:col-span-7 space-y-6">
      
      <!-- 手動切換控制器 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
          <span class="w-2 h-5 bg-red-accent rounded"></span>
          選擇查詢時段
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">選擇星期</label>
            <select id="daySelect" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="週一">星期一</option>
              <option value="週二">星期二</option>
              <option value="週三">星期三</option>
              <option value="週四">星期四</option>
              <option value="週五">星期五</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">選擇節數 (共 17 節)</label>
            <select id="periodSelect" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 focus:ring-2 focus:ring-red-500 outline-none"></select>
          </div>
        </div>
      </div>

      <!-- 17 節時間表框架 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
          <span class="w-2 h-5 bg-red-accent rounded"></span>
          學校時間表框架
        </h2>
        <div class="overflow-x-auto max-h-[600px]">
          <table class="w-full text-sm text-center border-collapse">
            <thead class="sticky top-0 bg-red-theme text-white">
              <tr>
                <th class="p-2.5 border border-red-700 w-32">節數 / 時段</th>
                <th class="p-2.5 border border-red-700">週一</th>
                <th class="p-2.5 border border-red-700">週二</th>
                <th class="p-2.5 border border-red-700">週三</th>
                <th class="p-2.5 border border-red-700">週四</th>
                <th class="p-2.5 border border-red-700">週五</th>
              </tr>
            </thead>
            <tbody id="timetableBody" class="divide-y divide-slate-200"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 右側：空節分析與老師名單 (佔 5 欄) -->
    <section class="lg:col-span-5 space-y-6">
      
      <!-- 當前時段統計面板 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="flex justify-between items-start mb-4">
          <div>
            <span id="currentSelectionBadge" class="inline-block px-3 py-1 bg-red-100 text-red-theme font-bold text-xs rounded-full mb-1">
              週一 - 早會前
            </span>
            <h3 class="text-xl font-bold text-slate-800">空節老師名單</h3>
          </div>
          <div class="text-right">
            <span id="freeTeacherCount" class="text-2xl font-black text-red-theme">0</span>
            <span class="text-xs text-slate-500 block">位老師空閒</span>
          </div>
        </div>

        <!-- 搜尋欄 -->
        <input type="text" id="searchTeacher" placeholder="搜尋老師姓名..." 
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 outline-none mb-4">

        <!-- 老師卡片列表 -->
        <div id="teacherList" class="grid grid-cols-2 gap-2.5 max-h-[520px] overflow-y-auto pr-1"></div>
      </div>
    </section>
  </main>

  <script>
    // 每日 17 節結構定義
    const PERIODS = [
      { name: "早會前", isLesson: false },
      { name: "班主任節", isLesson: false },
      { name: "第 1 節", isLesson: true },
      { name: "第 2 節", isLesson: true },
      { name: "小息 1", isLesson: false },
      { name: "第 3 節", isLesson: true },
      { name: "第 4 節", isLesson: true },
      { name: "小息 2", isLesson: false },
      { name: "第 5 節", isLesson: true },
      { name: "第 6 節", isLesson: true },
      { name: "午膳", isLesson: false },
      { name: "午息", isLesson: false },
      { name: "第 7 節", isLesson: true },
      { name: "第 8 節", isLesson: true },
      { name: "第 9 節", isLesson: true },
      { name: "第 10 節", isLesson: true },
      { name: "放學當值", isLesson: false }
    ];

    const DAYS = ["週一", "週二", "週三", "週四", "週五"];
    let teachers = []; // 儲存 46 位老師的資料結構
    let selectedDay = "週一";
    let selectedPeriod = "早會前";

    // 初始化介面
    function init() {
      // 填充節數選單
      const periodSelect = document.getElementById("periodSelect");
      periodSelect.innerHTML = PERIODS.map(p => `<option value="${p.name}">${p.name} ${!p.isLesson ? '(非授課)' : ''}</option>`).join("");

      // 渲染課表框架
      const tbody = document.getElementById("timetableBody");
      tbody.innerHTML = PERIODS.map(p => `
        <tr class="${!p.isLesson ? 'bg-slate-100 font-semibold text-slate-600' : 'hover:bg-red-50 cursor-pointer'} transition">
          <td class="p-2 border border-slate-200 text-xs text-left px-3">${p.name}</td>
          ${DAYS.map(d => `
            <td class="p-2 border border-slate-200 timetable-cell" data-day="${d}" data-period="${p.name}">
              ${p.isLesson ? '授課節' : p.name}
            </td>
          `).join("")}
        </tr>
      `).join("");

      // 綁定事件
      document.getElementById("daySelect").addEventListener("change", (e) => {
        selectedDay = e.target.value;
        updateView();
      });
      document.getElementById("periodSelect").addEventListener("change", (e) => {
        selectedPeriod = e.target.value;
        updateView();
      });
      document.querySelectorAll(".timetable-cell").forEach(cell => {
        cell.addEventListener("click", () => {
          selectedDay = cell.dataset.day;
          selectedPeriod = cell.dataset.period;
          document.getElementById("daySelect").value = selectedDay;
          document.getElementById("periodSelect").value = selectedPeriod;
          updateView();
        });
      });
      document.getElementById("searchTeacher").addEventListener("input", renderTeacherList);
      document.getElementById("excelFileInput").addEventListener("change", handleExcelUpload);

      updateView();
    }

    function updateView() {
      document.getElementById("currentSelectionBadge").innerText = `${selectedDay} - ${selectedPeriod}`;
      renderTeacherList();
    }

    // 處理 Excel 匯入
    function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawJson = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

        if (rawJson.length > 0) {
          const headers = rawJson[0];
          // 自動過濾無效欄位（如「第 1 欄」、「Unnamed」等）
          teachers = headers.slice(2).filter(name => name && !name.includes("第") && !name.includes("欄") && !name.includes("Unnamed"));
          alert(`成功匯入課表！共辨識到 ${teachers.length} 位老師。`);
          renderTeacherList();
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderTeacherList() {
      const listContainer = document.getElementById("teacherList");
      const filterText = document.getElementById("searchTeacher").value.trim().toLowerCase();
      
      const filtered = teachers.filter(t => t.toLowerCase().includes(filterText));
      document.getElementById("freeTeacherCount").innerText = filtered.length;

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="col-span-2 text-center text-slate-400 py-8 text-sm">暫無空節老師或未載入名單</div>`;
        return;
      }

      listContainer.innerHTML = filtered.map(name => `
        <div class="p-3 border border-slate-200 rounded-lg hover:border-red-400 bg-white flex items-center justify-between shadow-sm">
          <span class="font-medium text-slate-800 text-sm">${name}</span>
          <span class="text-[11px] bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">空節</span>
        </div>
      `).join("");
    }

    init();
  </script>
</body>
</html>
